name: Build and Release CodePulse HUD

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without the v prefix. Defaults to package.json.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      release_name: ${{ steps.release.outputs.release_name }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          input_version="${{ inputs.version }}"

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          elif [ -n "${input_version// }" ]; then
            tag="v${input_version#v}"
          else
            tag="v${package_version}"
          fi

          version="${tag#v}"
          prerelease=false
          if [[ "${version}" == *-* ]]; then
            prerelease=true
          fi
          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "release_name=CodePulse HUD ${tag}"
            echo "prerelease=${prerelease}"
          } >> "$GITHUB_OUTPUT"

      - name: Apply release version
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          node <<'EOF'
          const fs = require('node:fs')
          for (const path of ['package.json', 'apps/desktop/package.json']) {
            const json = JSON.parse(fs.readFileSync(path, 'utf8'))
            json.version = process.env.RELEASE_VERSION
            fs.writeFileSync(path, `${JSON.stringify(json, null, 2)}\n`)
          }
          EOF

      - name: Write release notes
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          node scripts/write-release-notes.mjs
          cp "${RUNNER_TEMP}/codepulse-release-notes.md" ./codepulse-release-notes.md

      - name: Upload release metadata
        uses: actions/upload-artifact@v4
        with:
          name: codepulse-hud-release-metadata-${{ steps.release.outputs.tag }}
          if-no-files-found: error
          path: |
            codepulse-release-notes.md
            package.json
            apps/desktop/package.json

  verify:
    name: Verify (Node ${{ matrix.node }})
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Restore release metadata
        uses: actions/download-artifact@v4
        with:
          name: codepulse-hud-release-metadata-${{ needs.prepare.outputs.tag }}
          path: .
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify
        run: |
          pnpm typecheck
          pnpm test
          pnpm smoke
          pnpm lint

  windows:
    name: Build Windows installer
    needs: [prepare, verify]
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Restore release metadata
        uses: actions/download-artifact@v4
        with:
          name: codepulse-hud-release-metadata-${{ needs.prepare.outputs.tag }}
          path: .
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Clean release output
        shell: pwsh
        run: Remove-Item -Path 'apps/desktop/release' -Recurse -Force -ErrorAction SilentlyContinue
      - name: Build Windows installer
        run: pnpm dist:win
      - name: Verify Windows installer
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $installer = "apps/desktop/release/CodePulse-HUD_${env:RELEASE_VERSION}_x64-setup.exe"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw "Missing Windows installer: $installer"
          }
          $size = (Get-Item -LiteralPath $installer).Length
          if ($size -lt 1MB) {
            throw "Windows installer is unexpectedly small: $size bytes"
          }
          Write-Host "OK Windows installer: $installer ($size bytes)"
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: codepulse-hud-windows-${{ needs.prepare.outputs.tag }}
          if-no-files-found: error
          path: |
            apps/desktop/release/CodePulse-HUD_*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest.yml

  publish:
    name: Publish GitHub release
    needs: [prepare, windows]
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download release metadata
        uses: actions/download-artifact@v4
        with:
          name: codepulse-hud-release-metadata-${{ needs.prepare.outputs.tag }}
          path: release-assets/metadata
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: codepulse-hud-windows-${{ needs.prepare.outputs.tag }}
          path: release-assets/windows
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_NAME: ${{ needs.prepare.outputs.release_name }}
          RELEASE_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          notes_file="release-assets/metadata/codepulse-release-notes.md"
          mapfile -t assets < <(
            find release-assets/windows -type f \( -name '*.exe' -o -name '*.blockmap' -o -name 'latest.yml' \) | sort
          )

          args=(
            release create "${RELEASE_TAG}" "${assets[@]}"
            --repo "${GITHUB_REPOSITORY}"
            --title "${RELEASE_NAME}"
            --notes-file "${notes_file}"
          )
          if [ "${RELEASE_PRERELEASE}" = "true" ]; then
            args+=(--prerelease --latest=false)
          else
            args+=(--latest)
          fi
          gh "${args[@]}"
