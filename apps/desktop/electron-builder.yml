appId: io.github.lbwc137.codepulsehud
productName: CodePulse HUD
electronVersion: 33.3.1
electronDist: ../../node_modules/electron/dist
# SerialPort ships an N-API prebuild. The legacy rebuilder preserves it instead of
# invoking node-gyp, which also keeps packaging reliable from paths containing spaces.
nativeRebuilder: legacy
compression: maximum
electronLanguages:
  - en-US
  - zh-CN
directories:
  output: release
  buildResources: build
# After pack: drop Windows software-Vulkan files the HUD does not need.
afterPack: scripts/after-pack.cjs
files:
  # Only app runtime outputs (never root-level preview screenshots under out/).
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - build/icon.png
  - package.json
  # Keep the Windows installer lean; serialport remains under node_modules.
  - '!**/*.map'
  - '!**/*.d.ts'
  - '!**/*.md'
  - '!**/*.ts'
  - '!**/README*'
  - '!**/CHANGELOG*'
  - '!**/LICENSE*'
  - '!**/license*'
  - '!**/tsconfig*.json'
  - '!**/.github/**'
  - '!**/test/**'
  - '!**/tests/**'
  - '!**/docs/**'
  - '!**/example/**'
  - '!**/examples/**'
  - '!**/benchmark/**'
  - '!**/benchmarks/**'
  - '!**/*.markdown'
  - '!**/node_modules/@serialport/bindings-cpp/src/**'
  - '!**/node_modules/@serialport/bindings-cpp/build/**'
  - '!**/node_modules/@serialport/bindings-cpp/binding.gyp'
  - '!**/node_modules/**/{prebuild-install,node-abi,napi-build-utils,tar-fs,tar-stream,rc,tunnel-agent,expand-template,github-from-package,simple-get,simple-concat,pump,bl,fs-constants,inherits,string_decoder,util-deprecate,buffer,base64-js,ieee754,minimist,deep-extend,ini,strip-json-comments,mkdirp-classic,chownr,detect-libc}/**'
extraResources:
  - from: ../../packages/hooks
    to: codepulse-hooks
    filter:
      - bin/**
      - lib/**
      - package.json
# Native serialport bindings must stay unpacked for dlopen().
asarUnpack:
  - '**/*.node'
win:
  icon: build/icon.png
  artifactName: CodePulse-HUD_${version}_${arch}-setup.${ext}
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  include: build/installer.nsh
